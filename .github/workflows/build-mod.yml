# Builds the modified SumatraPDF (scrollbar find markers + custom PDF icon)
# and uploads SumatraPDF-mod-64-install.exe as a workflow artifact.
name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Windows x64 release (mod)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build
        run: bun cmd/build.ts -rel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\rel64\SumatraPDF.exe dist\SumatraPDF-mod-64.exe
          # an exe whose name ends in -install.exe runs as the installer
          Copy-Item out\rel64\SumatraPDF.exe dist\SumatraPDF-mod-64-install.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-mod-64
          path: dist/*.exe
          retention-days: 30
